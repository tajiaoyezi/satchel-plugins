name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.module }} gofmt / vet / build / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [proxyparser, speedtester]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # 一个仓库两个 module，go.sum 在子目录；不写这一行 setup-go 只在仓库根找，缓存永远不生效。
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未经 gofmt：" && echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
